# ==============================================================================
# PERSONAL TASK BOARD (PTB) - MODELS & EMBEDDINGS CONFIGURATION
# ==============================================================================
# Cấu hình LLM & Embedding Provider cho Layer 2 Processing & Graphiti Memory.
# Hỗ trợ: OpenAI-compatible API (vLLM, LocalAI, OpenWebUI Pipelines) & Ollama.

default_llm_provider: "openai_compatible"
default_embedding_provider: "openai_compatible"

providers:
  # ----------------------------------------------------------------------------
  # 1. OpenAI-Compatible API (Cloud hoặc Local Inference Gateway)
  # ----------------------------------------------------------------------------
  openai_compatible:
    base_url: "${LLM_BASE_URL:-https://api.openai.com/v1}"
    api_key: "${LLM_API_KEY:-}"
    
    # Model trích xuất cấu trúc (Entity extraction, Task Candidates)
    extraction_model: "gpt-4o-mini"
    extraction_temperature: 0.1
    extraction_max_tokens: 2048

    # Model lập kế hoạch & reasoning (Planner, Priority explanation)
    planning_model: "gpt-4o"
    planning_temperature: 0.2
    planning_max_tokens: 4096

    # Embeddings cho Semantic Graph Vector Index
    embedding_model: "text-embedding-3-small"
    embedding_dimensions: 1536
    timeout_seconds: 45

  # ----------------------------------------------------------------------------
  # 2. Ollama Local Provider (Hoạt động hoàn toàn Offline)
  # ----------------------------------------------------------------------------
  ollama:
    base_url: "${OLLAMA_BASE_URL:-http://localhost:11434}"
    
    # Model trích xuất cấu trúc local
    extraction_model: "qwen2.5-coder:7b"
    extraction_temperature: 0.1
    extraction_max_tokens: 2048

    # Model lập kế hoạch local
    planning_model: "llama3.1:8b"
    planning_temperature: 0.2
    planning_max_tokens: 4096

    # Model vector embedding local
    embedding_model: "nomic-embed-text"
    embedding_dimensions: 768
    timeout_seconds: 60

# Cấu hình Vector Search trên Neo4j Community (GDS / Vector Index)
neo4j_vector_index:
  index_name: "unified_task_embeddings"
  dimensions: 1536
  similarity_function: "cosine"
