[project]
name = "ptb-intelligence"
version = "0.1.0"
description = "Layer 4: Deterministic Priority, Status Inference, and Anomaly Detection for Personal Task Board"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ptb-contracts",
    "ptb-database",
    "ptb-graph-memory",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
]

[tool.uv.sources]
ptb-contracts = { workspace = true }
ptb-database = { workspace = true }
ptb-graph-memory = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
