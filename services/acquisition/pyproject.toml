[project]
name = "ptb-acquisition"
version = "0.1.0"
description = "Layer 1: Data Acquisition Engine for Personal Task Board (Playwright Network Interception & Coding Agent Watchers)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ptb-contracts",
    "pydantic>=2.7.0",
    "playwright>=1.40.0",
    "platformdirs>=4.2.0",
]

[tool.uv.sources]
ptb-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
