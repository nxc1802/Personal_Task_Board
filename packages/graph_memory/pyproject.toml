[project]
name = "ptb-graph-memory"
version = "0.1.0"
description = "Graphiti Temporal Memory Integration for Personal Task Board"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ptb-contracts",
    "ptb-database",
    "pydantic>=2.7.0",
]

[tool.uv.sources]
ptb-contracts = { workspace = true }
ptb-database = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
