[project]
name = "personal-task-board"
version = "0.1.0"
description = "Personal Intelligence System for unified task management across Teams, Outlook, Jira, and Shortcut"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "services/*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["packages", "services", "integrations"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
