# ==============================================================================
# Personal Task Board (PTB) Production Deployment Configuration
# ==============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
# ==============================================================================

services:
  # 1. Neo4j Single-Store: Knowledge Graph & Temporal Memory
  neo4j:
    image: neo4j:5.26.0-community
    container_name: ptb_neo4j_prod
    restart: always
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-change_me_in_production}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
    volumes:
      - neo4j_prod_data:/data
      - neo4j_prod_logs:/logs
      - ./packages/database/neo4j/constraints:/var/lib/neo4j/import/constraints
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-change_me_in_production} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - ptb_network

  # 2. PTB Application Service & FastMCP Server Supervisor
  ptb-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ptb_app_prod
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
    environment:
      - PTB_HOST=0.0.0.0
      - PTB_PORT=8000
      - PTB_MCP_PORT=8001
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-change_me_in_production}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai_compatible}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - TENANT_ID=${TENANT_ID:-local-user}
      - PTB_ENABLE_DESTRUCTIVE_API=false
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ptb_network

  # 3. OpenWebUI: Local Chat, Tools & Artifacts UI
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.5.10
    container_name: ptb_openwebui_prod
    restart: always
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - ./data/openwebui:/app/backend/data
    environment:
      - WEBUI_AUTH=False
      - ENABLE_OLLAMA_API=False
      - OPENAI_API_BASE_URLS=${LLM_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_API_KEYS=${LLM_API_KEY:-}
      - WEBUI_NAME=Personal Task Board
    depends_on:
      - neo4j
      - ptb-app
    networks:
      - ptb_network

networks:
  ptb_network:
    name: ptb_network
    driver: bridge

volumes:
  neo4j_prod_data:
  neo4j_prod_logs:
