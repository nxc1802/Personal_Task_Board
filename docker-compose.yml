services:
  # Neo4j: Domain Knowledge Graph & Temporal Memory (APOC enabled)
  neo4j:
    image: neo4j:5.26.0-community
    container_name: ptb_neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474" # Neo4j Browser UI
      - "127.0.0.1:7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-change_me_in_production}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./packages/database/neo4j/constraints:/var/lib/neo4j/import/constraints
    networks:
      - ptb_network

  # OpenWebUI: Local Chat, Tools & Artifacts UI
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.5.10
    container_name: ptb_openwebui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/openwebui:/app/backend/data
    environment:
      # Local dev mode: authentication disabled for seamless local development. For production, see docker-compose.prod.yml (WEBUI_AUTH=True).
      - WEBUI_AUTH=False
      - ENABLE_OLLAMA_API=False
      - OPENAI_API_BASE_URLS=${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - OPENAI_API_KEYS=${LLM_API_KEY:-}
      - WEBUI_NAME=Personal Task Board
    command: bash -c "python3 /app/backend/data/patch_openwebui_board.py 2>/dev/null || true; exec bash start.sh"
    depends_on:
      - neo4j
    networks:
      - ptb_network

  # PTB: Unified Task Board Process Supervisor & FastMCP Server
  ptb-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ptb_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000" # REST API & Ingestion Webhooks
      - "127.0.0.1:8001:8001" # FastMCP Agent Protocol
    environment:
      - PTB_HOST=0.0.0.0
      - PTB_PORT=8000
      - PTB_MCP_PORT=8001
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-change_me_in_production}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai_compatible}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.5-flash}
      - TENANT_ID=${TENANT_ID:-local-user}
      - PTB_WORKSPACE_ROOT=/workspace
      - HOST_USER_HOME=/host_home
      - ANTIGRAVITY_BRAIN_DIR=/host_home/.gemini/antigravity/brain
      - CODEX_SESSION_DIR=/host_home/.codex/sessions
      - CURSOR_STORAGE_DIR=/host_home/AppData/Roaming/Cursor/User
      - CLAUDE_LOG_DIR=/host_home/AppData/Local/Claude/logs
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./services:/app/services
      - ./packages:/app/packages
      - ./integrations:/app/integrations
      - ${HOST_USER_HOME:-C:/Users/truon}:/host_home:ro
      - ${HOST_WORKSPACE:-D:/Working/PTB}:/workspace:ro
      - ./.git:/app/.git:ro
    depends_on:
      - neo4j
    networks:
      - ptb_network

  # Qwen3: Embedding 0.6B (OpenAI-compatible /v1/embeddings)
  qwen3-embedding:
    profiles: ["local-ai"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: ptb_qwen3_embedding
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ${QWEN_MODEL_PATH:-../Qwen3}:/models/qwen3:ro
    command: >
      -m /models/qwen3/Qwen3-Embedding-0.6B-Q8_0.gguf
      --alias qwen3-embedding-0.6b
      --embedding --pooling last
      --host 0.0.0.0 --port 8082
      -c 4096 -b 512 -ub 512 -np 1 -ngl 99 --no-ui
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8082/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ptb_network

  # Kev: Decision 0.8B (OpenAI-compatible /v1/chat/completions)
  kev-decision:
    profiles: ["local-ai"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: ptb_kev_decision
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ${KEV_MODEL_PATH:-../Kev}:/models/kev:ro
    command: >
      -m /models/kev/Kev-0.8B-Q8_0.gguf
      --alias kev-0.8b
      --host 0.0.0.0 --port 8081
      -c 4096 -b 512 -ub 512 -np 1 -ngl 99 --no-ui
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8081/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ptb_network

networks:
  ptb_network:
    name: ptb_network
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
