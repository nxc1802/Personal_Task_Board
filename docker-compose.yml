services:
  # Neo4j: Domain Knowledge Graph & Temporal Memory (APOC enabled)
  neo4j:
    image: neo4j:5.26.0-community
    container_name: ptb_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/personal_task_board_secret_2026
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./packages/database/neo4j/constraints:/var/lib/neo4j/import/constraints

volumes:
  neo4j_data:
  neo4j_logs:
