services:
  # Neo4j: Domain Knowledge Graph & Temporal Memory (APOC enabled)
  neo4j:
    image: neo4j:5.26.0-community
    container_name: ptb_neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474" # Neo4j Browser UI
      - "127.0.0.1:7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-change_me_in_production}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./packages/database/neo4j/constraints:/var/lib/neo4j/import/constraints
    networks:
      - ptb_network

  # OpenWebUI: Local Chat, Tools & Artifacts UI
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.5.10
    container_name: ptb_openwebui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - ./data/openwebui:/app/backend/data
    environment:
      - WEBUI_AUTH=False
      - ENABLE_OLLAMA_API=True
      - OPENAI_API_BASE_URLS=${LLM_BASE_URL:-http://127.0.0.1:11434/v1}
      - WEBUI_NAME=Personal Task Board
    depends_on:
      - neo4j
    networks:
      - ptb_network

networks:
  ptb_network:
    name: ptb_network
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
