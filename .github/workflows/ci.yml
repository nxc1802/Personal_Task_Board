name: CI Matrix

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    env:
      UV_LINK_MODE: copy
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.os }}-${{ matrix.python-version }}

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run Anti-Fallback & Contract Tests
        run: uv run pytest -m "contract" -v

      - name: Run Unit Tests
        run: uv run pytest -m "unit" -q

      - name: Run Fixture E2E Tests
        run: uv run pytest -m "fixture_e2e" -v

      - name: Run Runtime Smoke Tests
        run: uv run pytest -m "runtime_smoke" -v

      - name: Run Full Non-Docker Suite
        run: uv run pytest -m "not external_integration" -q

      - name: Verify CLI Help & Doctor Syntax
        run: uv run python scripts/ptb_cli.py --help

  live-e2e:
    name: Live E2E Integration (Neo4j Service)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      neo4j:
        image: neo4j:5.26.0-community
        env:
          NEO4J_AUTH: neo4j/taskboard123
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p taskboard123 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      UV_LINK_MODE: copy
      PYTHONUNBUFFERED: "1"
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: taskboard123
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Apply Neo4j constraints
        run: uv run python scripts/init_neo4j_ci.py

      - name: Run Live E2E Vertical Slice Test
        run: uv run pytest tests/test_external_integration.py --run-external -v
